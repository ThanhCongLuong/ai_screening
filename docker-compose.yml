version: '3.8'

services:
  # Service n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BLOCK_FS_WRITE_ACCESS=false
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./shared_data:/home/node/shared_data

  backend:
    build: .
    container_name: ai_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./shared_data:/app/shared_data
    depends_on:
      - n8n